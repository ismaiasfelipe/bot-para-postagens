name: Publicar painel (PWA)

# Publica a pasta webapp/ no GitHub Pages sempre que ela mudar. Sem
# servidor proprio -- o app e so HTML/CSS/JS estatico que fala direto
# com a API do GitHub (ver webapp/js/github-api.js).
#
# CONFIGURACAO NECESSARIA (fazer uma unica vez, pelo site do GitHub):
# Settings > Pages > Source > escolher "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar webapp/
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
