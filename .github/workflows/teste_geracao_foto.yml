name: Teste manual de geracao de foto

# Workflow descartavel pra testar gerar_foto_hero_com_verificacao() num
# produto especifico, sem publicar no Instagram nem commitar nada --
# so sobe o resultado como artifact pra conferir visualmente. Usado pra
# validar mudancas de prompt (ver gerar_carrossel_gemini.py) antes de
# deixar elas rodarem no pipeline de verdade.
on:
  workflow_dispatch:
    inputs:
      produto_id:
        description: "ID do produto em produtos_reais.json (ex: p010)"
        required: true
        default: "p010"

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install python-dotenv google-genai Pillow

      - name: Gerar foto de teste (com diagnostico)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 -c "
          import json, os
          import gerar_carrossel_gemini as g

          with open('produtos_reais.json') as f:
              banco = json.load(f)
          produto_id = '${{ inputs.produto_id }}'
          produto = next(p for p in banco['produtos'] if p['id'] == produto_id)
          referencias = [c for c in (produto.get('imagem_ambiente'), produto.get('imagem_estampa')) if c]

          prompt = g.montar_prompt_edicao(produto)
          caminho = g._gerar_e_retornar_caminho(prompt, referencias, f'teste_{produto_id}')
          print('CAMINHO GERADO:', caminho)
          if not caminho:
              raise SystemExit('geracao falhou, nada pra verificar')
          print('TAMANHO (bytes):', os.path.getsize(caminho))

          # comparacao: juiz com MODELO_IMAGEM (atual) vs um modelo de
          # texto/visao padrao, na MESMA imagem ja gerada (so 2 chamadas
          # de texto, nao gera imagem de novo)
          client = g._obter_cliente()
          partes_base = []
          for c in [caminho] + referencias:
              dados, mime_type = g._carregar_bytes_imagem(c)
              partes_base.append(g._part_de_bytes(dados, mime_type))
          prompt_juiz = g.montar_prompt_verificacao_hero(produto, len(referencias))

          for nome_modelo in ['gemini-2.5-flash-image', 'gemini-3.8-flash']:
              print(f'--- juiz com modelo: {nome_modelo} (3x pra checar consistencia) ---')
              for i in range(3):
                  try:
                      resposta = client.models.generate_content(model=nome_modelo, contents=partes_base + [prompt_juiz])
                      print(f'  [{i+1}]', repr(resposta.text))
                  except Exception as e:
                      print(f'  [{i+1}] ERRO:', repr(e))
          "

      - name: Subir resultado como artifact
        uses: actions/upload-artifact@v4
        with:
          name: teste-foto-${{ inputs.produto_id }}
          path: saida/teste_*
          retention-days: 7
