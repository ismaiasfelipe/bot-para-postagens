name: Teste manual de geracao de foto

# Workflow descartavel pra testar gerar_foto_hero_com_verificacao() num
# produto especifico, sem publicar no Instagram nem commitar nada --
# so sobe o resultado como artifact pra conferir visualmente. Usado pra
# validar mudancas de prompt (ver gerar_carrossel_gemini.py) antes de
# deixar elas rodarem no pipeline de verdade.
on:
  workflow_dispatch:
    inputs:
      produto_id:
        description: "ID do produto em produtos_reais.json (ex: p010)"
        required: true
        default: "p010"

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install python-dotenv google-genai Pillow

      - name: Gerar foto de teste (com diagnostico)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 -c "
          import json, os
          from gerar_carrossel_gemini import (
              montar_prompt_edicao, _gerar_e_retornar_caminho, verificar_foto_hero,
          )

          with open('produtos_reais.json') as f:
              banco = json.load(f)
          produto_id = '${{ inputs.produto_id }}'
          produto = next(p for p in banco['produtos'] if p['id'] == produto_id)
          print('Testando produto:', produto['nome'])
          referencias = [c for c in (produto.get('imagem_ambiente'), produto.get('imagem_estampa')) if c]
          print('referencias:', referencias)

          prompt = montar_prompt_edicao(produto)
          print('--- PROMPT (primeiros 300 chars) ---')
          print(prompt[:300])

          caminho = _gerar_e_retornar_caminho(prompt, referencias, f'teste_{produto_id}')
          print('CAMINHO GERADO:', caminho)
          if caminho:
              tamanho = os.path.getsize(caminho)
              print('TAMANHO DO ARQUIVO (bytes):', tamanho)
              try:
                  from PIL import Image
                  img = Image.open(caminho)
                  img.verify()
                  print('IMAGEM VALIDA, dimensoes:', Image.open(caminho).size)
              except Exception as e:
                  print('ERRO AO ABRIR IMAGEM:', repr(e))

              passou, motivo = verificar_foto_hero(caminho, referencias, produto)
              print('VERIFICACAO passou:', passou, '| motivo:', motivo)
          "

      - name: Subir resultado como artifact
        uses: actions/upload-artifact@v4
        with:
          name: teste-foto-${{ inputs.produto_id }}
          path: saida/teste_*
          retention-days: 7
